# MySQL 8 pour le dev local (Symfony sur la machine hôte se connecte à 127.0.0.1:3306).
# Démarrage : docker compose up -d
# Arrêt      : docker compose down   (les données restent dans le volume resto_mysql_data)
# Si le port 3306 est déjà pris sur Windows, changez en "3307:3306" et mettez :3307 dans DATABASE_URL.

services:
  db:
    image: mysql:8.4
    container_name: resto_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: resto_app_dev
      MYSQL_ROOT_PASSWORD: resto_root_dev
    ports:
      - "3306:3306"
    volumes:
      - resto_mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-presto_root_dev" ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  resto_mysql_data:
